variables:
  NPM_BUILD_PATH: dist/

stages:
  - Install
  - Build
  - Test
  - Publish

include:
  - project: sarqdev/catalogue-ci
    file: templates/.root.gitlab-ci.yml
  - project: sarqdev/catalogue-ci
    file: jobs/npm/.install-ci.gitlab-ci.yml
  - project: sarqdev/catalogue-ci
    file: jobs/npm/.build-v2.0.gitlab-ci.yml
  - project: sarqdev/catalogue-ci
    file: jobs/npm/.publish.gitlab-ci.yml

npm-publish-npmjs:
  stage: Publish
  image: node:26-alpine
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
  script:
    - npm --version
    - npm publish --registry=https://registry.npmjs.org/ --access=public --ignore-scripts
  only:
    - main
  needs:
    - job: npm-build
      artifacts: true

peer-dependency-smoke:
  stage: Test
  image: node:22
  script:
    - npm ci
    - npm run test:smoke
